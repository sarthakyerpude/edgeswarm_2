# Source geometry supplied by the warehouse Gazebo team: 12 m x 10 m world,
# centered at world (0,0). Grid convention is row -> Y and column -> X.
# resolution is 0.10 m so the supplied pickup/drop-off markers land exactly
# on grid-cell centers. Origin is the world coordinate of cell (0,0) corner.
#
meta:
  name: warehouse_v1
  resolution: 0.1
  width_cells: 120
  height_cells: 100
  origin: [-6.0, -5.0]

