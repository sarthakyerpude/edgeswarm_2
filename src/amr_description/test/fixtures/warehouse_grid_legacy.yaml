zones:
  inter_X1:
    type: intersection
    rect: [67, 50, 81, 69]
    capacity: 1

  aisle_A1:
    type: single_lane
    rect: [67, 3, 81, 116]
    capacity: 1

  aisle_A2:
    type: single_lane
    rect: [52, 3, 60, 116]
    capacity: 1

  # South crossing corridor / choke area, excluding the outer wall row.
  choke_CP1:
    type: choke
    rect: [1, 50, 45, 69]
    capacity: 1

