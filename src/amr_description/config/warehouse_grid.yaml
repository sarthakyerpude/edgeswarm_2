# =============================================================================
# warehouse_grid.yaml - Gazebo-aligned coordination map
# =============================================================================
#
# Source geometry supplied by the warehouse Gazebo team: 12 m x 10 m world,
# centered at world (0,0). Grid convention is row -> Y and column -> X.
# resolution is 0.10 m so the supplied pickup/drop-off markers land exactly
# on grid-cell centers. Origin is the world coordinate of cell (0,0) corner.
#
meta:
  name: warehouse_v1
  resolution: 0.1
  width_cells: 120
  height_cells: 100
  origin: [-6.0, -5.0]

# R7 equal aisles: north aisle, aisle A, aisle B and the N-S spine are all
# aisle_width_m wide (wall/rack face to rack face). Racks are 5.0 x 0.6 m;
# the 0.2 m end gaps to the side walls are narrower than a robot (0.32 m).
# Racks numbered left->right, top->bottom; world metres.
aisle_width_m: 1.6
racks:
  - {id: 1, x_min: -5.8, x_max: -0.8, y_min: 2.8, y_max: 3.4}
  - {id: 2, x_min: 0.8, x_max: 5.8, y_min: 2.8, y_max: 3.4}
  - {id: 3, x_min: -5.8, x_max: -0.8, y_min: 0.6, y_max: 1.2}
  - {id: 4, x_min: 0.8, x_max: 5.8, y_min: 0.6, y_max: 1.2}
  - {id: 5, x_min: -5.8, x_max: -0.8, y_min: -1.6, y_max: -1.0}
  - {id: 6, x_min: 0.8, x_max: 5.8, y_min: -1.6, y_max: -1.0}

