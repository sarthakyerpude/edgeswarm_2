# AMCL retune for the aliased-corridor regime (R11, 2026-10-05, this file is
# shared by all three robot namespaces: navigation.launch.py passes it to
# nav2_bringup with use_namespace:=True, whose RewrittenYaml re-roots every
# section under the robot's namespace - one edit tunes robot_1/2/3 alike).
# Measured problem (webots_remeasure, 1 Hz believed-vs-true trace, n=927):
# AMCL error mean 0.18 m / max 0.46 m at 0.6-1.0 m/s in the 1.6 m aisles,
# because the R7-equalized warehouse is lidar-self-similar. Three landmark_*
# solids now break that symmetry (warehouse.wbt + warehouse_map.pgm); the
# parameters below make the filter actually exploit them and recover from
# the residual in-aisle aliasing.
amcl:
  ros__parameters:
    use_sim_time: true
    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_link
    scan_topic: scan
    map_topic: map
    # 250/1000 -> 500/3000: the aliased corridors are MULTIMODAL - the cloud
    # must hold several x-offset hypotheses along a rack face until a
    # landmark/end-wall beam kills the wrong ones; 1000 particles collapsed
    # to one (sometimes wrong) mode. 3000 is the agreed CPU bound; KLD keeps
    # the steady-state count near min_particles once converged, so the full
    # 3000 is only paid during recovery bursts.
    min_particles: 500
    max_particles: 3000
    # likelihood_field -> likelihood_field_prob: plain likelihood_field
    # IGNORES the do_beamskip block below. The _prob variant scores with
    # beamskip, which drops beams that disagree with the map across most of
    # the cloud - i.e. the peer robots sharing the 1.6 m corridors (their
    # 0.04 m lidar posts are unmapped) stop dragging the pose while mapped
    # structure (racks, walls, landmarks) keeps its full weight.
    laser_model_type: likelihood_field_prob
    # 0.10/0.10 -> 0.05/0.05: at 1.0 m/s cruise 0.10 m already updated every
    # scan, but the wedges happen in the SLOW approaches beside rack faces
    # (<= 0.25 m/s) where 0.10 m meant <= 2.5 corrections/s while belief
    # drifted. 0.05 m / ~3 deg doubles the correction rate exactly there and
    # during the 1.2 rad/s turn-model spins (yaw diverged first in the live
    # runs); the extra CPU is bounded because the scan rate caps updates.
    update_min_d: 0.05
    update_min_a: 0.05
    # Resample every 2nd filter update (default 1): more frequent updates +
    # self-similar corridors = sample impoverishment (every particle
    # duplicates the one plausible-looking mode). Halving the resample rate
    # preserves hypothesis diversity between landmark sightings.
    resample_interval: 2
    transform_tolerance: 1.0     # was 0.5: scans/odom arrive late on a loaded host
    # Gentle recovery injection (was 0.0/0.0 = disabled): injects random
    # poses only while the short-term likelihood average w_fast stays below
    # the long-term w_slow, i.e. precisely the measured failure (belief
    # wedged 0.3-0.5 m off with high confidence, StopZone stops with permit
    # GO). With the asymmetric landmarks in the map, wrongly injected
    # particles die in a few updates while a correct one near the true pose
    # can win - without them, injection in a self-similar map was a lottery,
    # which is why it was off.
    # Round 2 (loc_validate): the canonical 0.001/0.1 pair was too hot - a
    # 1-2 update likelihood dip (peer occluding the landmark sector) sank
    # w_fast (time constant ~0.1 s of updates) enough to inject, sigma
    # spiked, and the lane gate thrashed (78 LANES<->SPINE flips, mean
    # episode 7 s). Halving both alphas quarters nothing structural: w_fast
    # now averages over ~20 updates (~2 s) so occlusion transients no longer
    # open a w_fast < w_slow gap, while the REAL divergences (sustained
    # > 0.3 m for many seconds, 8 measured) depress w_fast for their whole
    # duration and still fire injection within ~2-3 s of onset; w_slow's
    # longer baseline (~1/0.0005 updates) keeps the reference from chasing
    # the divergence down, preserving the trigger.
    recovery_alpha_slow: 0.0005
    recovery_alpha_fast: 0.05
    tf_broadcast: true
    set_initial_pose: false
    always_reset_initial_pose: false
    # Active now that laser_model_type is likelihood_field_prob (see above).
    # 0.5 m mismatch tolerance never skips the gradual-drift correction
    # (error grows from < 0.1 m between updates) and never skips landmark
    # beams of a converged cloud; a beam is only dropped when > 30% of the
    # cloud disagrees with the map by > 0.5 m (a peer robot mid-corridor).
    # If > 90% of beams would be skipped the full scan is used instead
    # (beam_skip_error_threshold) so a truly lost filter still measures.
    do_beamskip: true
    beam_skip_distance: 0.5
    beam_skip_threshold: 0.3
    beam_skip_error_threshold: 0.9
    # Motion noise raised for the 1.0 m/s cruise (2026-10-04): each scan
    # interval now covers 2.5x the distance, and yaw diverged first in the
    # live run, so the rotational terms (alpha1, alpha2) grow most.
    # (Kept through the R11 retune: the odometry quality is unchanged.)
    alpha1: 0.35    # rotation noise from rotation   (was 0.2)
    alpha2: 0.35    # rotation noise from translation (was 0.2)
    alpha3: 0.25    # translation noise from translation (was 0.2)
    alpha4: 0.25    # translation noise from rotation (was 0.2)
    alpha5: 0.1
    # 60 -> 90 beams (4 deg spacing, was 6): the 0.3 m pillar subtends ~4.3
    # deg at 4 m and the 0.4/0.6 m fins ~4-6 deg at range - at 6 deg spacing
    # a landmark could fall BETWEEN beams and contribute nothing. 4 deg
    # guarantees >= 1 beam on every landmark within its useful range. Cost
    # is bounded: steady-state is 90 x ~500 particles (KLD), comparable to
    # the old 60 x 1000 worst case.
    max_beams: 90
    # 0.95/0.05 -> 0.90/0.10: z_rand doubles so unmapped returns (peer
    # robots, the movable box) are explained as noise instead of bending the
    # pose toward them; z_short/lambda_short and z_max are inert under the
    # likelihood-field models (kept for documentation/beam-model fallback).
    z_hit: 0.90
    z_short: 0.05
    z_max: 0.05
    z_rand: 0.10
    # 0.2 -> 0.10: the sharper hit kernel is what converts the landmarks
    # into accuracy. At sigma 0.2 a 0.2 m pose offset cost a beam only ~1
    # sigma - the likelihood surface was too flat to separate the aliased
    # x-offsets (measured mean error 0.18 m ~= the old sigma). At 0.10 a
    # 0.2 m offset is 2 sigma per beam and the target regime (max <= 0.25 m,
    # mean <= 0.12 m) sits inside the kernel's discriminating range.
    # Overconfidence on a wrong mode is covered by resample_interval 2 +
    # the recovery injection above.
    sigma_hit: 0.10
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    robot_model_type: nav2_amcl::DifferentialMotionModel

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: odom
    default_nav_to_pose_bt_xml: "$(find-pkg-share nav2_bt_navigator)/behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml"

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 10.0
    enable_stamped_cmd_vel: false
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: [progress_checker]
    goal_checker_plugins: [goal_checker, precise_goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.15
      movement_time_allowance: 10.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.20
      stateful: true
    # Docking only (fleet_goal_bridge picks it for paths that end on the
    # robot's spawn/dock pose): finish on the spot and square up to the
    # spawn yaw. RPP rotates to the goal heading inside xy_goal_tolerance.
    precise_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.05
      yaw_goal_tolerance: 0.07
      stateful: true
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.6     # 1.5x the original 0.4 (was 1.0: corner cutting + slip put robots into rack ends, 2026-10-04)
      # RECTILINEAR TURN MODEL (user directive, 2026-10-04): the goal bridge
      # splits every route into straight segments at >= 60 deg heading
      # changes and sends them as sequential goals whose final pose carries
      # the NEXT segment's heading. RPP then drives: rotate in place to the
      # segment heading (use_rotate_to_heading; min_angle 0.5 so a 90 deg
      # turn or a post-BackUp misalignment always spins first instead of
      # re-driving the arc that wedged it - F1's 3x BackUp loop), run the
      # straight, and rotate to the goal yaw at the segment end (the spin at
      # the turn point, legalized by the collision monitor's rotation band
      # and placed by the planner where the swept disc fits). 1.2 rad/s
      # keeps the spin well inside the smoother's 2.0 rad/s / 3.2 rad/s^2.
      use_rotate_to_heading: true
      # 0.9 rad (52 deg), raised from 0.5 (webots_live_final diagnosis): the
      # segment-END spins come from rotateToGoalHeading (active within the
      # goal xy tolerance regardless of this threshold) and segment STARTS
      # after a turn/BackUp are misaligned ~90 deg+, so the rectilinear turn
      # model keeps all its spins. What 0.5 broke: a robot pressed to ~0.2 m
      # of a rack face (belief-truth drift at the measured sigma 0.2-0.43)
      # needs a <= 45 deg heading correction to escape, and at 0.5 RPP
      # SPUN first - which the 0.33 m rotation polygon rightly vetoes that
      # close to a face - so the robot could neither spin nor drive (the
      # rack-3 EB wedge cluster, 7 wedges/14 StopZone stops). At 0.9 those
      # corrections ARC in the slow band (curvature regulation caps v at
      # ~0.1 m/s, 0.30 m box), which the face clearance allows.
      rotate_to_heading_min_angle: 0.9
      rotate_to_heading_angular_vel: 1.2
      # Shorter, velocity-scaled lookahead: segments are straight lines, so
      # a long carrot buys nothing - it only cut the remaining gentle 45 deg
      # merge jogs toward rack faces (the measured 0.8-1.2 m carrot was a
      # cause of the F2 corner swing). 1.0 s of lookahead = 0.6 m at cruise,
      # clamped 0.3-0.9.
      lookahead_dist: 0.6
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.0
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.08
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 1.5   # was 0.8: at 1.0 m/s cruise the robot must start braking for a turn earlier or it swings 0.16 m wide into the rack throats (fleet_sim, 2026-10-04)
      regulated_linear_scaling_min_speed: 0.10
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.6
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 3.0

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 2.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      tolerance: 0.25
      use_astar: true
      allow_unknown: false

# bringup_launch.py (Jazzy) lifecycle-manages these servers alongside the
# controller/planner/behavior nodes. Keep explicit plugin lists so an omitted
# section cannot silently fall back to a different distro's defaults.
smoother_server:
  ros__parameters:
    use_sim_time: true
    smoother_plugins: [simple_smoother]
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

route_server:
  ros__parameters:
    use_sim_time: true
    boundary_radius_to_achieve_node: 1.0
    radius_to_achieve_node: 2.0
    smooth_corners: true
    operations: [AdjustSpeedLimit, ReroutingService, CollisionMonitor]
    AdjustSpeedLimit:
      plugin: nav2_route::AdjustSpeedLimit
    ReroutingService:
      plugin: nav2_route::ReroutingService
    CollisionMonitor:
      plugin: nav2_route::CollisionMonitor
      max_collision_dist: 3.0
    edge_cost_functions: [DistanceScorer, CostmapScorer]
    DistanceScorer:
      plugin: nav2_route::DistanceScorer
    CostmapScorer:
      plugin: nav2_route::CostmapScorer

waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 200

docking_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3
    base_frame: base_link
    fixed_frame: odom
    dock_backwards: false
    dock_prestaging_tolerance: 0.5
    dock_plugins: [simple_charging_dock]
    simple_charging_dock:
      plugin: opennav_docking::SimpleChargingDock
      docking_threshold: 0.05
      staging_x_offset: -0.7
      use_external_detection_pose: true
      use_battery_status: false
      use_stall_detection: false
      external_detection_timeout: 1.0
      external_detection_translation_x: -0.18
      external_detection_translation_y: 0.0
      external_detection_rotation_roll: -1.57
      external_detection_rotation_pitch: -1.57
      external_detection_rotation_yaw: 0.0
      filter_coef: 0.1
    controller:
      k_phi: 3.0
      k_delta: 2.0
      v_linear_min: 0.15
      v_linear_max: 0.15
      use_collision_detection: true
      costmap_topic: local_costmap/costmap_raw
      footprint_topic: local_costmap/published_footprint
      transform_tolerance: 0.1
      projection_time: 5.0
      simulation_step: 0.1
      dock_collision_threshold: 0.3

behavior_server:
  ros__parameters:
    use_sim_time: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: [spin, backup, drive_on_heading, wait]
    spin: {plugin: nav2_behaviors::Spin}
    backup: {plugin: nav2_behaviors::BackUp}
    drive_on_heading: {plugin: nav2_behaviors::DriveOnHeading}
    wait: {plugin: nav2_behaviors::Wait}
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.2
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.8
    min_rotational_vel: 0.2
    rotational_acc_lim: 1.5

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: base_link
      update_frequency: 1.0
      publish_frequency: 1.0
      resolution: 0.05
      track_unknown_space: true
      robot_radius: 0.26
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer: {plugin: nav2_costmap_2d::StaticLayer, map_subscribe_transient_local: true}
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan: {topic: scan, max_obstacle_height: 1.5, clearing: true, marking: true, data_type: LaserScan, raytrace_max_range: 8.0, obstacle_max_range: 6.0}
      inflation_layer: {plugin: nav2_costmap_2d::InflationLayer, cost_scaling_factor: 3.0, inflation_radius: 0.45}
      always_send_full_costmap: true

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom
      robot_base_frame: base_link
      update_frequency: 5.0
      publish_frequency: 2.0
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      robot_radius: 0.26
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan: {topic: scan, max_obstacle_height: 1.5, clearing: true, marking: true, data_type: LaserScan, raytrace_max_range: 8.0, obstacle_max_range: 6.0}
      inflation_layer: {plugin: nav2_costmap_2d::InflationLayer, cost_scaling_factor: 3.0, inflation_radius: 0.40}
      always_send_full_costmap: true

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 10.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity: [0.7, 0.0, 2.0]
    min_velocity: [-0.4, 0.0, -2.0]
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.25
    max_accel: [2.0, 0.0, 3.2]
    max_decel: [-2.0, 0.0, -3.2]
    enable_stamped_cmd_vel: false

collision_monitor:
  ros__parameters:
    use_sim_time: true
    base_frame_id: base_link
    odom_frame_id: odom
    cmd_vel_in_topic: cmd_vel_smoothed
    cmd_vel_out_topic: cmd_vel_raw
    transform_tolerance: 0.2
    source_timeout: 0.5
    stop_pub_timeout: 1.0
    enable_stamped_cmd_vel: false
    polygons: [StopZone]
    StopZone:
      # Speed-banded stop zones (velocity_polygon). CORNER/ROTATION FIXES
      # (2026-10-04, webots_strictlanes1): the old 'forward' band covered
      # linear_min -0.001, i.e. it ALSO gated pure-rotation commands, and a
      # robot whose nose faced a wall (robot_1 at the J_N wall lane) could
      # then neither drive NOR TURN IN PLACE - BackUp freed 0.2 m and the
      # retry drove straight back in, forever. Four bands now:
      #
      #   reversing     v <= -0.02: 0.35 m rear box (back out of a wedge).
      #   rotation      |v| <= 0.02 (spin in place): a 12-gon of the SWEPT-
      #                 ROTATION footprint, vertex radius 0.33 m (covers the
      #                 0.286 m circumscribed body disc + >= 3 cm margin at
      #                 the inscribed radius 0.319). Rotating when this disc
      #                 is clear is ALWAYS allowed - it is the turn model's
      #                 primitive (straight -> spin -> straight), and the
      #                 planner only places turn points where >= 0.45 m of
      #                 static clearance exists. 0.33 < 0.35 keeps spins ON
      #                 the engineered lane lines (0.35 m from rack faces)
      #                 legal, e.g. squaring up at a pickup.
      #   forward_slow  0.02 < v <= 0.25: 0.30 m front box (0.10 m past the
      #                 nose). Stopping from 0.25 m/s at 2 m/s^2 decel +
      #                 ~0.15 s latency needs < 0.06 m, so 0.10 m past the
      #                 nose is ample - and the short box is what lets the
      #                 rectilinear profile CREEP to a turn point or lane
      #                 line near a wall/rack face (RPP's approach scaling
      #                 caps those approaches below 0.25 m/s).
      #   forward       v > 0.25: the full 0.45 m front box (0.25 m past the
      #                 nose; at scan height a peer is only its 0.04 m lidar
      #                 post, so cruise needs the long reach to see it in
      #                 time). Width stays the chassis half-width so side
      #                 racks >= 0.35 m away never trigger it.
      #
      # The bands tile the whole command space (no uncovered velocity).
      type: velocity_polygon
      holonomic: false
      velocity_polygons: [reversing, rotation, forward_slow, forward]
      reversing:
        points: "[[0.0, 0.17], [0.0, -0.17], [-0.35, -0.17], [-0.35, 0.17]]"
        linear_min: -2.0
        linear_max: -0.02
        theta_min: -4.0
        theta_max: 4.0
      rotation:
        points: "[[0.33, 0.0], [0.2858, 0.165], [0.165, 0.2858], [0.0, 0.33],
                  [-0.165, 0.2858], [-0.2858, 0.165], [-0.33, 0.0],
                  [-0.2858, -0.165], [-0.165, -0.2858], [0.0, -0.33],
                  [0.165, -0.2858], [0.2858, -0.165]]"
        linear_min: -0.02
        linear_max: 0.02
        theta_min: -4.0
        theta_max: 4.0
      forward_slow:
        points: "[[0.30, 0.17], [0.30, -0.17], [0.0, -0.17], [0.0, 0.17]]"
        linear_min: 0.02
        linear_max: 0.25
        theta_min: -4.0
        theta_max: 4.0
      forward:
        points: "[[0.45, 0.17], [0.45, -0.17], [0.0, -0.17], [0.0, 0.17]]"
        linear_min: 0.25
        linear_max: 2.0
        theta_min: -4.0
        theta_max: 4.0
      action_type: stop
      min_points: 3
      visualize: true
      polygon_pub_topic: stop_zone
      enabled: true
    observation_sources: [scan]
    scan:
      type: scan
      topic: scan

# bond_timeout 12 s (was the 4 s default): under host load 50+ the bond
# heartbeats starve and the watchdog fired "CRITICAL FAILURE:
# collision_monitor IS DOWN after not receiving a heartbeat" mid-run,
# RESETTING the managed nodes while robots were in traffic
# (webots_live_final). A slow heartbeat is strictly safer than a mid-traffic
# reset (the velocity gate and collision monitor fail closed); bonds stay
# ENABLED so a truly dead node is still caught, just with load tolerance.
lifecycle_manager_localization:
  ros__parameters:
    use_sim_time: true
    autostart: true
    bond_timeout: 12.0
    node_names: [map_server, amcl]

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: true
    autostart: true
    bond_timeout: 12.0
    node_names: [controller_server, smoother_server, planner_server, route_server,
                 behavior_server, velocity_smoother, collision_monitor,
                 bt_navigator, waypoint_follower, docking_server]
