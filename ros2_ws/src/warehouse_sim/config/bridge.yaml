# bridge.yaml - ros_gz_bridge parameter_bridge config for three_amr.launch.py
# (also used, subset only needed, by single_amr.launch.py)
#
# Gazebo Harmonic (gz-sim) <-> ROS 2 Jazzy, three robots: robot_1, robot_2,
# robot_3, spawned at spawn_1/spawn_2/spawn_3 in warehouse.sdf.
#
# Topic naming follows amr_description's docs/GAZEBO_INTEGRATION.md exactly,
# so the coordination layer on the ankit/ros2-dds branch can consume these
# without any changes on its side:
#   /robot_N/odom, /robot_N/scan  (Gazebo -> ROS)
#   /robot_N/cmd_vel              (ROS -> Gazebo)
#   /clock                        (Gazebo -> ROS, shared across all robots)
#
# No /tf entries in this revision - only odom/scan/cmd_vel per robot plus
# shared clock were asked for here. (An earlier single-robot version of this
# file also bridged /model/robot_1/tf -> /tf for RViz/nav use; that's
# dropped for now, flag if you want it added back for all three.)

- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

# robot_1
- ros_topic_name: "/robot_1/odom"
  gz_topic_name: "/model/robot_1/odometry"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

- ros_topic_name: "/robot_1/scan"
  gz_topic_name: "/world/warehouse/model/robot_1/link/laser_link/sensor/lidar/scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS

- ros_topic_name: "/robot_1/cmd_vel"
  gz_topic_name: "/model/robot_1/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ

