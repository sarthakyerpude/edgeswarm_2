# bridge.yaml - ros_gz_bridge parameter_bridge config for single_amr.launch.py
#
# Gazebo Harmonic (gz-sim) <-> ROS 2 Jazzy, one robot named "robot_1".
#
# Topic naming follows amr_description's docs/GAZEBO_INTEGRATION.md exactly,
# so the coordination layer on the ankit/ros2-dds branch can consume these
# without any changes on its side:
#   /robot_1/odom, /robot_1/scan, /clock  (Gazebo -> ROS)
#   /robot_1/cmd_vel                      (ROS -> Gazebo)
#
# /tf is included per this task's spec even though amr_description's docs
# say the coordination layer doesn't need it (it works in the map frame) -
# it's here for RViz / the nav stack / anything else that does need TF.
#
# To extend to robot_2 / robot_3 for a future three-robot launch file, copy
# each block below and swap "robot_1" for the new robot name - the gz side
# topic names update automatically because the model is spawned with that
# name (see amr_description/models/amr_robot/model.sdf).


- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

- ros_topic_name: "/robot_1/odom"
  gz_topic_name: "/model/robot_1/odometry"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

- ros_topic_name: "/robot_1/scan"
  gz_topic_name: "/world/warehouse/model/robot_1/link/laser_link/sensor/lidar/scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS

- ros_topic_name: "/robot_1/cmd_vel"
  gz_topic_name: "/model/robot_1/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ

- ros_topic_name: "/tf"
  gz_topic_name: "/model/robot_1/pose"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "gz.msgs.Pose_V"
  direction: GZ_TO_ROS
